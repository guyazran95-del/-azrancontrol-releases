<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AzranControl ניהול</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#6e6e73;--line:#e5e5ea;--brand:#1e88e5;--ok:#34c759;--warn:#ff9f0a;--bad:#ff3b30;--field:#f7f7fa}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#1a2129;--text:#f2f2f7;--sub:#9aa4af;--line:#2c3540;--field:#121820}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:17px;padding:0 16px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:20px 0 12px}
header h1{font-size:24px;flex:1}
header h1 small{display:block;font-size:14px;font-weight:400;color:var(--sub)}
.who{font-size:13px;color:var(--sub);text-align:left}
.who button{margin-top:4px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--field);color:var(--text)}
button.primary{background:var(--brand);color:#fff;font-weight:600}
button.danger{background:transparent;color:var(--bad)}
button.small{padding:6px 12px;font-size:14px}
button:disabled{opacity:.5}
.big{width:100%;padding:16px;font-size:18px;margin:8px 0 16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.app{display:flex;align-items:center;gap:14px}
.av{width:48px;height:48px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.app .info{flex:1;min-width:0}
.app .name{font-weight:600;font-size:18px}
.app .meta{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--line);color:var(--sub);margin-inline-start:6px;vertical-align:middle}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.center{text-align:center;padding:40px 0}
.center p{color:var(--sub);margin:12px 0 20px}
label{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text)}
input[dir=ltr]{text-align:left}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:16px;color:var(--text)}
.check input{width:22px;height:22px}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.hint.err{color:var(--bad)}
dialog{border:0;border-radius:20px;padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--card);color:var(--text);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:20px;margin-bottom:4px}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.actions .primary{flex:1}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>AzranControl<small>ניהול החנות</small></h1>
  <div class="who" id="who"></div>
</header>

<section id="loading" class="center"><p>טוען…</p></section>

<section id="login" class="center" hidden>
  <p>כדי לנהל את החנות צריך להיכנס עם חשבון הגוגל של המנהל.</p>
  <button class="primary big" id="btnLogin">כניסה עם Google</button>
  <p class="hint err" id="loginErr"></p>
</section>

<section id="panel" hidden>
  <button class="primary big" id="btnAdd">+ הוסף אפליקציה</button>
  <div id="list"></div>
</section>

<dialog id="dlg">
  <form id="frm" method="dialog" autocomplete="off">
    <h2 id="dlgTitle">אפליקציה חדשה</h2>
    <label for="fName">שם האפליקציה</label>
    <input id="fName" required autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="fUrl">קישור להורדה (שיתוף מגוגל דרייב או קישור ישיר ל-APK)</label>
    <input id="fUrl" required dir="ltr" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint" id="urlHint">בדרייב: שתף ב"כל מי שיש לו את הקישור", העתק והדבק כאן.</div>
    <label for="fVersion">גרסה</label>
    <div class="row">
      <input id="fVersion" required dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="1.0">
      <button type="button" class="small" id="btnBump">+1</button>
    </div>
    <div class="hint">כשמשנים את הגרסה, ללקוחות שהתקינו את האפליקציה יופיע "עדכן".</div>
    <label for="fDesc">תיאור (לא חובה)</label>
    <textarea id="fDesc"></textarea>
    <label class="check"><input type="checkbox" id="fHidden"> להסתיר מהחנות (בלי למחוק)</label>
    <div class="actions">
      <button type="submit" class="primary" id="btnSave">שמור</button>
      <button type="button" id="btnCancel">ביטול</button>
      <button type="button" class="danger" id="btnDel" hidden>מחק</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, setDoc, doc, deleteDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAeT_i7ds4iBJrgRPtY11_3Z2XgNa-U9nA",
  authDomain: "azrancontrole.firebaseapp.com",
  projectId: "azrancontrole",
  storageBucket: "azrancontrole.firebasestorage.app",
  messagingSenderId: "195265171839",
  appId: "1:195265171839:web:072fb97c8729f7be650a4a",
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const show = (id, on) => { $(id).hidden = !on; };

let apps = [];      // [{id, ...fields}]
let editing = null; // doc id or null

function toast(msg, ms = 3000) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}

function friendly(e) {
  const c = e && e.code || "";
  if (c.includes("permission-denied")) return "אין הרשאה לשמור. ודא שנכנסת עם חשבון המנהל ושכללי Firebase עודכנו.";
  if (c.includes("unauthorized-domain")) return "הדומיין של הדף לא מאושר ב-Firebase (Authentication ← Settings ← Authorized domains).";
  if (c.includes("operation-not-allowed")) return "הכניסה עם Google לא מופעלת ב-Firebase (Authentication ← Sign-in method).";
  if (c.includes("popup-closed")) return "חלון הכניסה נסגר.";
  return (e && e.message) || String(e);
}

// Fields typed on a phone may carry stray spaces / capitals ("version ", "URL").
function norm(data) {
  const o = {};
  for (const [k, v] of Object.entries(data || {})) o[k.trim().toLowerCase()] = typeof v === "string" ? v.trim() : v;
  return o;
}

function render() {
  const list = $("list");
  list.replaceChildren();
  const rows = apps.filter(a => a.id !== "azrancontrol" && a.package !== "com.azrancontrol.app")
                   .sort((a, b) => (a.name || "").localeCompare(b.name || "", "he"));
  if (!rows.length) {
    const d = document.createElement("div"); d.className = "empty";
    d.textContent = "עדיין אין אפליקציות בחנות. לחץ \"הוסף אפליקציה\".";
    list.append(d); return;
  }
  for (const a of rows) {
    const card = document.createElement("div"); card.className = "card app";
    const av = document.createElement("div"); av.className = "av"; av.textContent = (a.name || "?").slice(0, 1).toUpperCase();
    const info = document.createElement("div"); info.className = "info";
    const name = document.createElement("div"); name.className = "name"; name.textContent = a.name || "(ללא שם)";
    if (a.hidden === true || a.hidden === "true") {
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "מוסתרת"; name.append(tag);
    }
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (a.version ? "גרסה " + a.version : "בלי גרסה") + (a.description ? " · " + a.description : "");
    info.append(name, meta);
    const btn = document.createElement("button"); btn.className = "small"; btn.textContent = "עריכה";
    btn.onclick = () => openForm(a);
    card.append(av, info, btn);
    list.append(card);
  }
}

function openForm(a) {
  editing = a ? a.id : null;
  $("dlgTitle").textContent = a ? "עריכת " + (a.name || "") : "אפליקציה חדשה";
  $("fName").value = a?.name || "";
  $("fUrl").value = a?.url || "";
  $("fVersion").value = a?.version || (a ? "" : "1");
  $("fDesc").value = a?.description || "";
  $("fHidden").checked = a?.hidden === true || a?.hidden === "true";
  show("btnDel", !!a);
  checkUrl();
  $("dlg").showModal();
}

function checkUrl() {
  const u = $("fUrl").value.trim(), h = $("urlHint");
  if (!u) { h.className = "hint"; h.textContent = "בדרייב: שתף ב\"כל מי שיש לו את הקישור\", העתק והדבק כאן."; return true; }
  if (!/^https?:\/\//i.test(u)) { h.className = "hint err"; h.textContent = "הקישור צריך להתחיל ב-https://"; return false; }
  if (/drive\.google\.com/.test(u) && !/\/file\/d\/[\w-]+|[?&]id=[\w-]+/.test(u)) {
    h.className = "hint err"; h.textContent = "זה לא נראה כמו קישור לקובץ בדרייב. העתק את הקישור של הקובץ עצמו."; return false;
  }
  h.className = "hint"; h.textContent = /drive\.google\.com/.test(u) ? "קישור דרייב ✓ ודא שהשיתוף פתוח לכל מי שיש לו את הקישור." : "קישור ישיר ✓";
  return true;
}
$("fUrl").addEventListener("input", checkUrl);

$("btnBump").onclick = () => {
  const v = $("fVersion").value.trim() || "0";
  const m = v.match(/^(.*?)(\d+)(\D*)$/);
  $("fVersion").value = m ? m[1] + (parseInt(m[2], 10) + 1) + m[3] : v + ".1";
};
$("btnCancel").onclick = () => $("dlg").close();
$("btnAdd").onclick = () => openForm(null);

$("frm").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!checkUrl()) return;
  const data = {
    name: $("fName").value.trim(),
    url: $("fUrl").value.trim(),
    version: $("fVersion").value.trim(),
    description: $("fDesc").value.trim(),
    hidden: $("fHidden").checked,
    updatedAt: serverTimestamp(),
  };
  if (!data.name || !data.url || !data.version) { toast("צריך למלא שם, קישור וגרסה"); return; }
  $("btnSave").disabled = true;
  try {
    if (editing) await setDoc(doc(db, "apps", editing), data);
    else await addDoc(collection(db, "apps"), data);
    $("dlg").close(); toast("נשמר ✓ הלקוחות יראו את השינוי ברענון החנות");
  } catch (e) { toast(friendly(e), 6000); }
  $("btnSave").disabled = false;
});

$("btnDel").onclick = async () => {
  if (!editing || !confirm("למחוק את " + $("fName").value + " מהחנות? (האפליקציה לא תוסר מרכבים שכבר התקינו אותה)")) return;
  try { await deleteDoc(doc(db, "apps", editing)); $("dlg").close(); toast("נמחק"); }
  catch (e) { toast(friendly(e), 6000); }
};

$("btnLogin").onclick = async () => {
  $("loginErr").textContent = "";
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if ((e.code || "").includes("popup-blocked")) { await signInWithRedirect(auth, p); return; }
    $("loginErr").textContent = friendly(e);
  }
};
getRedirectResult(auth).catch(e => { $("loginErr").textContent = friendly(e); });

let unsub = null;
onAuthStateChanged(auth, user => {
  show("loading", false);
  show("login", !user); show("panel", !!user);
  const who = $("who"); who.replaceChildren();
  if (user) {
    const e = document.createElement("div"); e.textContent = user.email;
    const b = document.createElement("button"); b.className = "small"; b.textContent = "יציאה"; b.onclick = () => signOut(auth);
    who.append(e, b);
    if (!unsub) unsub = onSnapshot(collection(db, "apps"),
      snap => { apps = snap.docs.map(d => ({ id: d.id, ...norm(d.data()) })); render(); },
      e => toast(friendly(e), 6000));
  } else if (unsub) { unsub(); unsub = null; }
});
</script>
</body>
</html>
